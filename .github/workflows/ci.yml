name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scikit-learn 1.8+ requires Python 3.11, and the committed model
        # pickles were built with 1.9. On 3.10 pip can only resolve 1.7, which
        # loads those artefacts but fails at predict time.
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySpark needs a JVM. The pipeline runs local[*] only -- no Hadoop,
      # HDFS or YARN is installed or configured.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The suite is self-contained: it synthesises its own fixture data and
        # skips the checks that need trained artefacts.
        run: pytest -q

      - name: Verify the dataset generator reproduces the documented properties
        # The 1.76 GB source file is not in the repository, so CI regenerates a
        # small one and checks its statistical structure.
        run: |
          python scripts/generate_dataset.py --rows 400000 --chunk-rows 200000

      - name: Verify the pipeline runs end to end on a small sample
        run: python scripts/smoke_test.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install linters
        run: pip install ruff
      - name: Ruff
        run: ruff check src backend tests run.py --output-format=github
